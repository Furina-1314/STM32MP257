; ============================================================================
; Salacia_Terminal 全局配置
; 编码：UTF-8（Qt6 QSettings IniFormat 约定，源码则为 GBK）
; 修改后重启程序生效；所有可调参数必须在本文件维护，禁止硬编码进源码
; ============================================================================

[log]
; 日志输出目录（相对可执行文件工作目录）
dir = logs
; 日志级别：debug / info / warning / error
level = info

[video]
; 板端 RTP/H264 视频流 UDP 端口（CamStream 发送目标端口）
rtp_port = 5000
; rtpjitterbuffer 缓冲（ms）：低延迟优先；网络抖动剧烈时可增大（如 50）
jitter_latency_ms = 20
; 首选 H264 解码器：d3d11h264dec（D3D11 通用硬解，Intel/AMD/NVIDIA 均可）
; 探测失效时自动回退 nvh264dec / avdec_h264（软解兜底）
preferred_decoder = d3d11h264dec

[ai]
; 是否启用 AI 识别
enable = true
; ONNX 模型路径（相对工作目录或绝对路径）
model_path = models/model.onnx
; 模型输入尺寸（像素）
input_width = 640
input_height = 640
; 置信度阈值（0.0 ~ 1.0）
confidence_threshold = 0.50
; NMS 重叠抑制 IoU 阈值（0.0 ~ 1.0）
nms_iou_threshold = 0.45
; 推理后端：auto（按硬件探测 CUDA/TensorRT -> DirectML -> CPU）
; 或显式指定：cpu / dml / cuda / tensorrt
execution_provider = auto

[rov]
; 20Hz 传感器遥测 UDP 端口（协议草案 v2 见 src/communication/TelemetryPacket.h）
; 板载传感器：MPU6500（姿态）+ 舱内温湿度 + 电池电压
telemetry_port = 5001
; 电池电量折算参数（电压->百分比线性映射，默认 4S 锂电）
battery_full_voltage = 16.8
battery_empty_voltage = 13.0
; 板端 SSH 登录参数（Phase 6 启用）
ssh_host = 192.168.137.2
ssh_port = 22
ssh_user = root
; SSH 密码（无私钥时使用；竞赛内网环境接受明文，量产可改密钥认证）
ssh_password =
; 私钥路径（可选，公钥认证优先；留空走密码）
ssh_key_path =
; 断线自动重连周期（秒）
ssh_reconnect_sec = 5

[control]
; 执行机构遥控 PWM 量程（微秒）；板端 CLI 约定：pwm <id> <us>
; id 1-10 = 舵机（0~180° 线性映射），id 11-16 = 推进器（-100%~+100%）
servo_min_us = 500
servo_max_us = 2500
thruster_min_us = 1100
thruster_max_us = 1900
thruster_neutral_us = 1500

[imu]
; Mahony 姿态解算增益（Kp 比例：越大加速度修正越强；Ki 积分：消除稳态偏差）
mahony_kp = 0.5
mahony_ki = 0.0
