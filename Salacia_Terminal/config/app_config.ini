; ============================================================================
; Salacia_Terminal 全局配置
; 编码：UTF-8（Qt6 QSettings IniFormat 约定，源码则为 GBK）
; 修改后重启程序生效；所有可调参数必须在本文件维护，禁止硬编码进源码
; ============================================================================

[network]
; 岸基主机（本机）IP：视频/遥测 UDP 接收绑定地址，也是板端推流的目标地址。
; Windows ICS 有线 NAT 模式下主机固定为 192.168.137.1；留空 = 0.0.0.0 监听全部接口
; 使用路由器的情况下，参考分配的IP
host_ip = 192.168.1.100
; 开发板 IP：SSH 指令通道目标（[rov] ssh_host 留空时使用），预留未来板端定向业务
board_ip = 192.168.1.120
; 视频 RTP/H264 接收端口（板端 CamStream udpsink 目标端口）
rtp_port = 5000
; 20Hz 传感器遥测 UDP 接收端口
telemetry_port = 5001
; UDP 遥测兼容回退开关（TCP 100Hz 传感器汇总为主数据源；A35 TCP 未就绪期间保留）
telemetry_udp_enable = true
; 遥测判活：看门狗周期与离线阈值（ms）
telemetry_watchdog_ms = 500
telemetry_stale_ms = 1000

[tcp]
; Windows<->A35 TCP 控制通道（wire format 为候选草案，实机对接前以 mock 验证）
enable = true
; 目标主机；留空 = 用 [network] board_ip
host =
; 目标端口（待 A35 分配确认）
port = 7000
connect_timeout_ms = 3000
request_timeout_ms = 1000
heartbeat_enable = true
heartbeat_interval_ms = 1000
reconnect_enable = true
reconnect_base_ms = 1000
reconnect_max_ms = 10000
max_retry = 0
tcp_nodelay = true
recv_buffer_limit = 65536
max_payload = 4096
send_queue_capacity = 64
sensor_expected_hz = 100
sensor_stale_ms = 500

[log]
; 日志输出目录（相对可执行文件工作目录）
dir = logs
; 日志级别：debug / info / warning / error
level = info
; 单文件滚动大小（字节）
max_file_bytes = 10485760

[video]
; rtpjitterbuffer 缓冲（ms）：低延迟优先；真机网络抖动剧烈/花屏时可增大（如 60）
jitter_latency_ms = 40
; 首选 H264 解码器：d3d11h264dec（D3D11 通用硬解，Intel/AMD/NVIDIA 均可）
; 探测失效时自动回退 nvh264dec / avdec_h264（软解兜底）
preferred_decoder = d3d11h264dec
; 接收套接字缓冲（字节，抗码流包突发防内核丢包）
socket_buffer_bytes = 2097152
; 看门狗周期 / 无帧自愈阈值 / 自愈重建延迟 / 总线错误重建延迟 / 无包提示 / 统计周期（ms）
watchdog_interval_ms = 500
stall_threshold_ms = 2000
restart_delay_ms = 100
bus_restart_delay_ms = 500
no_packet_hint_ms = 5000
stats_interval_ms = 1000

[ai]
; 是否启用 AI 识别
enable = true
; ONNX 模型路径（相对工作目录或绝对路径）
model_path = models/model.onnx
; 类别标签文件：YOLO 训练侧 data.yaml（读取 names: 段）或每行一个类别名的纯文本
; 留空 = 不显示类别名（检测框退化为"类别 N"）；绘制时每类别独立配色 + 左上角标签框
label_file = E:/STM32MP257/AIModel/data.yaml
; 模型输入尺寸（像素）
input_width = 640
input_height = 640
; 置信度阈值（0.0 ~ 1.0）
confidence_threshold = 0.50
; NMS 重叠抑制 IoU 阈值（0.0 ~ 1.0）
nms_iou_threshold = 0.45
; 推理后端：auto（按硬件探测 CUDA/TensorRT -> DirectML -> CPU）
; 或显式指定：cpu / dml / cuda / tensorrt
execution_provider = auto
; 推理帧环轮询节拍（ms）
poll_interval_ms = 5

[rov]
; 板载传感器：MPU6500（姿态）+ 舱内温湿度 + 电池电压
; 电池电量折算参数（电压->百分比线性映射，默认 4S 锂电）
battery_full_voltage = 16.8
battery_empty_voltage = 13.0
; SSH 运行时已于 Phase 5 移除：控制通道统一走 [tcp]（历史 ssh_* 键作废，
; 迁移说明见 README"SSH 移除清单"节）

[control]
; 执行机构遥控 PWM 量程（微秒）；板端 CLI 约定：pwm <id> <us>
; id 1-10 = 舵机（0~180° 线性映射），id 11-16 = 推进器（-100%~+100%）
servo_min_us = 500
servo_max_us = 2500
thruster_min_us = 1100
thruster_max_us = 1900
thruster_neutral_us = 1500
; 通道数量与值域（协议文档：10 舵机 0-180°，6 推进器 -100~+100）
servo_count = 10
thruster_count = 6
id_base = 1
servo_min_deg = 0
servo_max_deg = 180
servo_step_deg = 1
thruster_min_pct = -100
thruster_max_pct = 100
thruster_step_pct = 1
; 滑条拖动发送限频（ms）；松开/确认时立即发送最终值
slider_rate_limit_ms = 50
release_flush = true

[battery]
; 4S 锂电池（固定 4 串）。化学体系与 SOC 分段曲线未标定前，电量显示"待标定"并保留原始总电压
; soc_curve 格式："v1 v2 ... : s1 s2 ..."（电压:百分比分段线性，空格分隔；
; 逗号写法会被兼容读取但不推荐；空 = 待标定）
cell_count = 4
chemistry =
soc_curve =
soc_filter_alpha = 0.2
soc_hysteresis_pct = 3
low_threshold_pct = 30
critical_threshold_pct = 15

[dyp]
; DYP-RD 前向测距（wire 单位待 A35 确认，暂定 mm）
unit = mm
precision = 0
valid_min_mm = 20
valid_max_mm = 8000
stale_ms = 500
warn_distance_mm = 1000
danger_distance_mm = 300

[alarms]
; 告警中心容量与合并
max_items = 200
merge_window_ms = 5000
log_alarms = true

[ui]
; 主题/配色/样式（浅色 + Fluent + FluentUI3 为默认；FluentUIStyle 界面 Phase 4 接入）
theme = light
palette = fluent
style = FluentUI3
; GUI 文本刷新频率（Hz）与 3D 姿态渲染频率（保持现状 20Hz）
text_refresh_hz = 5
attitude_render_hz = 20
; 显示精度（小数位）
angle_precision = 1
voltage_precision = 2
distance_precision = 0
; 紧急操作确认：紧急停机一键直发；紧急上浮二次确认
estop_confirm = false
emergency_confirm = true
; 状态栏消息时长（ms）
status_message_short_ms = 3000
status_message_long_ms = 5000
status_message_error_ms = 10000
; 主窗口初始尺寸与视频拉取重绘节拍
window_width = 1440
window_height = 860
video_render_interval_ms = 33
; 指令页左上角小视频尺寸（与主页共享同一管线）
command_video_width = 320
command_video_height = 180
; 检测框绘制
detect_line_width = 2.0
detect_label_font_pt = 9.5
; 控制区样式
estop_button_color = #8c2f2f
estop_button_hover_color = #a83a3a
estop_button_min_height = 42
link_online_color = #3ddc84
link_offline_color = #c0a040
control_name_label_width = 64
control_value_label_width = 110
; 自定义强调色（空 = FluentUIStyle 默认蓝；设置页选择后写回）
accent_color =
; 姿态视图
attitude_background_color = #141922
attitude_min_height = 340

[system]
; Worker 停止限时阶梯（wait -> interrupt -> terminate，ms）与退出静默期
worker_stop_wait_ms = 3000
worker_interrupt_wait_ms = 2000
worker_terminate_wait_ms = 1000
exit_grace_ms = 500

[imu]
; Mahony 姿态解算增益（Kp 比例：越大加速度修正越强；Ki 积分：消除稳态偏差）
mahony_kp = 0.5
mahony_ki = 0.0
