; ============================================================================
; Salacia_Terminal 全局配置
; 编码：UTF-8（Qt6 QSettings IniFormat 约定，源码则为 GBK）
; 修改后重启程序生效；所有可调参数必须在本文件维护，禁止硬编码进源码
; ============================================================================

[log]
; 日志输出目录（相对可执行文件工作目录）
dir = logs
; 日志级别：debug / info / warning / error
level = info

[video]
; 板端 RTP/H264 视频流 UDP 端口（CamStream 发送目标端口）
rtp_port = 5000
; rtpjitterbuffer 缓冲（ms）：低延迟优先；网络抖动剧烈时可增大（如 50）
jitter_latency_ms = 20
; 首选 H264 解码器：d3d11h264dec（D3D11 通用硬解，Intel/AMD/NVIDIA 均可）
; 探测失效时自动回退 nvh264dec / avdec_h264（软解兜底）
preferred_decoder = d3d11h264dec

[ai]
; 是否启用 AI 识别
enable = true
; ONNX 模型路径（相对工作目录或绝对路径）
model_path = models/model.onnx
; 模型输入尺寸（像素）
input_width = 640
input_height = 640
; 置信度阈值（0.0 ~ 1.0）
confidence_threshold = 0.50
; 推理后端：auto（按硬件探测 CUDA/TensorRT -> DirectML -> CPU）
; 或显式指定：cpu / dml / cuda / tensorrt
execution_provider = auto

[rov]
; 20Hz 传感器遥测 UDP 端口（协议待与板端约定，见 .vibestate.md TD-3）
telemetry_port = 5001
; 板端 SSH 登录参数（Phase 6 启用）
ssh_host = 192.168.137.2
ssh_port = 22
ssh_user = root
