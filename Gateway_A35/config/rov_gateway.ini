; ============================================================================
; rov_gateway 配置示例（阶段5）
; 安装位置：/etc/rov_gateway.ini（rov_gateway.service 中 --config 指定）
; 缺失的键使用内置默认值；整个文件缺失时网关也能以默认配置运行。
; 修改后重启服务生效：systemctl restart rov_gateway
; ============================================================================

[tcp]
; 监听端口（Windows Salacia_Terminal [tcp] port 对应）
port = 7000
; 绑定地址（0.0.0.0 = 全部接口）
bind = 0.0.0.0
; 单客户端控制权策略：takeover = 新连接接管（默认，Mock 行为一致）
;                    reject = 拒绝新连接，保持现有客户端
client_policy = takeover
; 帧载荷上限与接收缓存上限（字节，与 Windows 侧约定一致）
max_payload = 4096
recv_buffer_limit = 65536

[rov]
; RPMsg 设备路径（网关是唯一 owner）
device = /dev/ttyRPMSG0

[gateway]
; Safe 模式推进器限幅（±%，D-09：保守占位值，真实推进器测试前必须用户确认；
; 100 = 不限幅）
safe_limit_pct = 30
; 客户端断开时执行全局 Stop（D-07：默认启用，真实推进器测试前必须用户确认）
stop_on_disconnect = true
; 心跳超时判定（ms，0 = 禁用；依赖 Windows 端心跳开启，D-17）
heartbeat_timeout_ms = 5000
; 权威状态周期补发间隔（ms）
state_period_ms = 1000
; M33 数据链路看门狗（T-01，2026-09-04 用户批准）：MPU 持续失败超过
; timeout 后网关以专用退出码退出，systemd 重启链（preflight+m33_gate）
; 恢复楔死的 M33 并重落 stop 锁存；0 = 禁用；轮询周期 >= timeout/2 时自动禁用
mpu_watchdog_timeout_ms = 60000
; 看门狗启动宽限期（ms）：给首轮轮询和收敛留时间
mpu_watchdog_grace_ms = 30000
; 普通命令队列容量（紧急命令永不丢弃）
normal_queue_capacity = 256
; 出站帧队列上限（100Hz 流 vs 无客户端；丢最旧）
outbound_queue_capacity = 512

[sensors]
; sysfs 根（一般不改；测试注入用）
sysfs_root = /sys
; DHT11 接口：auto = 先正点原子 misc 后标准 IIO（D-21）
;             alientek_misc | standard_iio
dht11_mode = auto
; DHT11 采样周期（ms，下限 1000）
dht11_period_ms = 2000
; DHT11 三位数据兼容解析（D-22：默认关闭=拒绝猜测）
dht11_three_digit_compat = false
; INA226 采样周期（ms）
ina226_period_ms = 500
; MPU 采样周期（ms，经 RovControl）。
; 部署默认 1000（T-01 缓解：高频轮询长跑后 M33 侧退化，见 TROUBLESHOOTING.md；
; 根因闭环后可回调 20~50）
mpu_period_ms = 1000
; DYP 采样周期（ms，下限 100）。部署默认 5000（同上）
dyp_period_ms = 5000
; 陈旧判定系数（× 各自周期）
stale_factor = 3
; DYP 有效距离窗口（mm；65533 类 UART 值判无效，D-10）
dyp_valid_min_mm = 20
dyp_valid_max_mm = 8000
; INA226 母线电压范围（V）
bus_voltage_min_v = 0
bus_voltage_max_v = 36
; SensorSummary 发送周期（ms；10 = 100Hz）
summary_period_ms = 10

[log]
; debug | info | warning | error（systemd/journald 自动采集标准输出）
level = info

[camstream]
; 视频推流（独立 rov_camstream.service 读取本节；rov_gateway 不使用）
; 目标岸基地址与端口（Windows [network] host_ip / rtp_port 对应）
host = 192.168.1.100
port = 5000
; H264 码率与关键帧间隔
bitrate = 2000000
keyframe_interval = 30
; 采集格式
width = 1920
height = 1080
framerate = 30
